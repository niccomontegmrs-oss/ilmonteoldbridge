name: Sincronizza calendario Airbnb

on:
  schedule:
    - cron: '0 4,16 * * *'   # due volte al giorno (UTC)
  workflow_dispatch:          # pulsante per lanciarlo a mano

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica il calendario
        env:
          AIRBNB_ICAL: ${{ secrets.AIRBNB_ICAL }}
        run: node scripts/sync-airbnb.mjs
      # [skip netlify]: salva le date nel codice senza ripubblicare i siti.
      # Netlify pubblica solo quando Niccolò lo chiede dopo un lavoro sui siti.
      - name: Salva ilmonteoldbridge1/date.json se è cambiato
        run: |
          git config user.name "airbnb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ilmonteoldbridge1/date.json ilmonteoldbridge1/date-dirette.json
          git diff --staged --quiet || git commit -m "Aggiorna disponibilita [skip netlify]"
          git push
